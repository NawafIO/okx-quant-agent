[project]
name = "okxq"
version = "0.1.0"
description = "OKX quantitative multi-agent trading system - Phase 2 / M0 scaffold"
requires-python = ">=3.11"
# Lower bounds here; EXACT pins live in the committed uv.lock (prerequisite P-2).
# Per finding R-5, ccxt is never auto-upgraded: bumping it requires re-running the
# full DEMO integration suite, which does not exist until M6.
dependencies = [
    "ccxt>=4.4,<5",
    "pydantic>=2.9,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "duckdb>=1.1,<2",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okxq"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "S"]
ignore = [
    "ANN401",  # Any is occasionally the honest annotation at parse boundaries
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use magic values, and deliberately handle fake secrets.
"tests/**" = ["S101", "S105", "S106", "ANN201", "ANN001"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
# The pydantic plugin is required because contract fields use Annotated[Decimal, ...]:
# statically the type is Decimal, but D-1 requires *constructing* from str for exactness.
# init_typed = false lets validated input types through the constructor. D-1 itself is
# enforced at runtime by the BeforeValidator and proved by tests/unit/test_contracts.py -
# the static layer was never the enforcement mechanism.
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
files = ["src/okxq", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = false
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "ccxt.*"
ignore_missing_imports = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "guard: safety-critical guard tests; a failure here blocks all progress",
    "network: requires network access (never run in M0)",
]

# --- coverage ---------------------------------------------------------------
[tool.coverage.run]
source = ["src/okxq"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise AssertionError"]
