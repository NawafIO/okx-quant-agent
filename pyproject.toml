[project]
name = "okxq"
version = "0.1.0"
description = "OKX quantitative multi-agent trading system - Phase 2 / M0 scaffold"
requires-python = ">=3.11"
# Lower bounds here; EXACT pins live in the committed uv.lock (prerequisite P-2).
# Per finding R-5, ccxt is never auto-upgraded: bumping it requires re-running the
# full DEMO integration suite, which does not exist until M6.
dependencies = [
    "ccxt>=4.4,<5",
    "pydantic>=2.9,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "duckdb>=1.1,<2",
    "pyarrow>=17",
    # Q-3 resolved at M1: TA-Lib installs from a prebuilt Windows wheel on this host, no C
    # toolchain needed, and computes correctly (201 functions). Declared here rather than
    # installed ad hoc, so `uv sync --locked` in CI reproduces it.
    "ta-lib>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
    "pandas-stubs>=2.2",
    # Directive objective 4: pre-commit secret scan (carried forward from M0's P-4).
    "pre-commit>=3.8",
    "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okxq"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "S"]
ignore = [
    "ANN401",  # Any is occasionally the honest annotation at parse boundaries
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use magic values, and deliberately handle fake secrets.
"tests/**" = ["S101", "S105", "S106", "ANN201", "ANN001"]
# Recon scripts are committed as dated *evidence* for the Q-1/Q-3 findings in
# docs/VENUE_FACTS.md, not as library code. They assert, print, and catch broadly while
# probing an unfamiliar API - which is the correct shape for a probe.
# S608 (SQL injection) is noise here: the queries interpolate our own local Parquet paths
# and literal constants, with no untrusted input and read-only access to local files.
"scripts/**" = ["S101", "ANN", "BLE001", "T201", "INP001", "S608"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
# The pydantic plugin is required because contract fields use Annotated[Decimal, ...]:
# statically the type is Decimal, but D-1 requires *constructing* from str for exactness.
# init_typed = false lets validated input types through the constructor. D-1 itself is
# enforced at runtime by the BeforeValidator and proved by tests/unit/test_contracts.py -
# the static layer was never the enforcement mechanism.
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
files = ["src/okxq", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = false
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "ccxt.*"
ignore_missing_imports = true

# pyarrow ships no py.typed marker.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "duckdb.*"]
ignore_missing_imports = true

# Recon scripts are committed evidence, not library code (see ruff per-file-ignores).
[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "guard: safety-critical guard tests; a failure here blocks all progress",
    "network: requires network access (never run in M0)",
]

# --- coverage ---------------------------------------------------------------
[tool.coverage.run]
source = ["src/okxq"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise AssertionError"]
