name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# No credentials are available to CI. The guard job asserts that LIVE is unreachable, so a
# change that unlocks live trading fails the build (LIVE lock Layer 4, architecture §6.4).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install (locked)
        # --locked fails if uv.lock is stale, so dependencies cannot drift silently.
        # This is also finding R-5's control: ccxt never changes version implicitly.
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check (strict)
        run: uv run mypy

      - name: Guard tests (ZERO-LIVE-CAPITAL)
        # Run first and separately: if a safety guard fails, that is the headline, not a
        # detail buried in a 70-test summary.
        run: uv run pytest -m guard -v

      - name: Full suite with coverage (offline)
        # -m "not network" is the actual enforcement that CI stays offline. An earlier
        # version of this file instead ran `pytest -m network --collect-only`, which was
        # inverted both ways: pytest exits 5 ("no tests collected") when the invariant
        # holds, failing the job, and exits 0 if network tests do exist. Verified locally.
        run: uv run pytest -m "not network" --cov --cov-report=term-missing --cov-report=xml

      - name: Risk Engine 100% branch coverage (M5 acceptance, not negotiable)
        # Its own coverage config with NO exclusions (.coveragerc-risk). This exact command
        # is pinned by tests/guards/test_risk_enforcement.py.
        run: uv run pytest tests/unit/risk tests/guards/test_risk_policy_frozen.py -p no:cacheprovider --cov=okxq.risk --cov-config=.coveragerc-risk --cov-branch --cov-fail-under=100 --cov-report=term-missing

      - name: Engine martingale invariant (powered, M2 acceptance)
        # Chief Advisor ruling 2026-10-03: no strategy may make money through the engine on
        # a fat-tailed price martingale, net of its own modelled slippage - the only test that
        # can catch optimism in the stop/exit path. ~1M trades per configuration.
        run: uv run python scripts/verify_engine_martingale.py --workers 4
